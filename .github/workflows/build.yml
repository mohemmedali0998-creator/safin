name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: build
        shell: bash
        run: gradle build --stacktrace --console=plain 2>&1 | tee build.log

      - name: show errors
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E "^e: |error:|What went wrong|Caused by|FAILED|Could not" -A4 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log

      - name: upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: safin-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
