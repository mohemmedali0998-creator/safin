name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show repository layout
        run: |
          pwd
          ls -la
          echo "--- gradle files ---"
          find . -maxdepth 3 \( -name "build.gradle*" -o -name "settings.gradle*" -o -name "gradlew" -o -name "gradle-wrapper.jar" \)

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.0

      - name: Build
        run: gradle clean build --no-daemon

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: build/libs/*.jar
          if-no-files-found: error
