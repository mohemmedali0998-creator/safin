name: build
on: [push, workflow_dispatch]
jobs:
  safin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: |
          ZIP=$(ls safin-v*.zip | sort -V | tail -1)
          unzip -q "$ZIP" -d proj
          cd proj
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: safin
          path: proj/build/libs/
  shieldac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: |
          unzip -q ShieldAC-source.zip -d src
          cd src/ShieldAC
          mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ShieldAC
          path: src/ShieldAC/target/ShieldAC.jar
