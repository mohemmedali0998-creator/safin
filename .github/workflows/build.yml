name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: |
          ZIP=$(ls safin-v*.zip | sort -V | tail -1)
          unzip -q "$ZIP" -d proj
          cd proj
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: proj/build/libs/
